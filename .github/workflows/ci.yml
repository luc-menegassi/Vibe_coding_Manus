name: Validar site

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validar e construir site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar arquivos principais
        shell: bash
        run: |
          set -euo pipefail

          test -f index.html
          test -f guia.html
          test -f projeto-integrador.html
          test -f checklists.html
          test -f sobre.html
          test -f assets/css/style.css
          test -f assets/js/app.js
          test -f package.json
          test -f scripts/build-chapters.mjs

          echo "Arquivos principais encontrados."

      - name: Verificar capítulos Markdown
        shell: bash
        run: |
          set -euo pipefail

          test -d capitulos

          chapters=(
            "Capítulo 01 — Ambiente e terminal.md"
            "Capítulo 02 — Planejamento e decisão da linguagem.md"
            "Capítulo 03 — Entrega e organização do projeto.md"
            "Capítulo 04 — Debug em camadas.md"
            "Capítulo 05 — Como calibrar a IA.md"
            "Capítulo 06 — Construção e publicação no GitHub com Actions.md"
            "Capítulo 07 — Contexto e exploração do projeto.md"
            "Capítulo 08 — Especificação.md"
            "Capítulo 09 — Planejamento.md"
            "Capítulo 10 — Implementação com a IA.md"
            "Capítulo 11 — Engenharia e arquitetura de segurança do projeto.md"
          )

          for chapter in "${chapters[@]}"; do
            if [ ! -f "capitulos/$chapter" ]; then
              echo "Capítulo não encontrado: $chapter"
              exit 1
            fi
          done

          echo "Os 11 capítulos oficiais foram encontrados."


      - name: Gerar páginas HTML dos capítulos
        run: npm run build:chapters

      - name: Validar capítulos HTML gerados
        shell: bash
        run: |
          set -euo pipefail

          test -d _site/capitulos

          generated_count=$(find _site/capitulos \
            -maxdepth 1 \
            -type f \
            -name "*.html" \
            | wc -l)

          echo "Capítulos HTML gerados: $generated_count"

          if [ "$generated_count" -ne 11 ]; then
            echo "Erro: eram esperadas exatamente 11 páginas HTML."
            exit 1
          fi

          test -s _site/capitulos/01-ambiente-terminal.html
          test -s _site/capitulos/11-seguranca-arquitetura.html

          echo "Build validado com sucesso."
