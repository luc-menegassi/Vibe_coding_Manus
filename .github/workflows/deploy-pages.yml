name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construir site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar capítulos Markdown
        shell: bash
        run: |
          set -euo pipefail

          test -d capitulos

          chapters=(
            "Capítulo 1 — Ambiente e terminal.md"
            "Capítulo 2 — Planejamento e decisão da linguagem.md"
            "Capítulo 3 — Entrega e organização do projeto.md"
            "Capítulo 4 — Debug em camadas.md"
            "Capítulo 5 — Como calibrar a IA.md"
            "Capítulo 6 — Construção e publicação no GitHub com Actions.md"
            "Capítulo 7 — Contexto e exploração do projeto.md"
            "Capítulo 8 — Especificação.md"
            "Capítulo 9 — Planejamento.md"
            "Capítulo 10 — Implementação com a IA.md"
            "Capítulo 11 — Engenharia e arquitetura de segurança do projeto.md"
          )

          for chapter in "${chapters[@]}"; do
            if [ ! -f "capitulos/$chapter" ]; then
              echo "Capítulo não encontrado: $chapter"
              exit 1
            fi
          done

          echo "Os 11 capítulos oficiais foram encontrados."


      - name: Gerar páginas HTML dos capítulos
        run: npm run build:chapters

      - name: Preparar diretório de publicação
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site

          cp index.html _site/
          cp guia.html _site/
          cp projeto-integrador.html _site/
          cp checklists.html _site/
          cp sobre.html _site/

          cp -R assets _site/

          touch _site/.nojekyll

          echo "Arquivos estáticos copiados para _site."

      - name: Validar conteúdo de publicação
        shell: bash
        run: |
          set -euo pipefail

          test -f _site/index.html
          test -f _site/guia.html
          test -f _site/projeto-integrador.html
          test -f _site/checklists.html
          test -f _site/sobre.html
          test -f _site/assets/css/style.css
          test -f _site/assets/js/app.js

          test -d _site/capitulos

          chapter_count=$(find _site/capitulos \
            -maxdepth 1 \
            -type f \
            -name "*.html" \
            | wc -l)

          echo "Páginas de capítulo geradas: $chapter_count"

          if [ "$chapter_count" -ne 11 ]; then
            echo "Erro: eram esperadas exatamente 11 páginas HTML."
            exit 1
          fi

          test -s _site/capitulos/01-ambiente-terminal.html
          test -s _site/capitulos/11-seguranca-arquitetura.html

          echo "Conteúdo de publicação validado."

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer upload do artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar site
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
