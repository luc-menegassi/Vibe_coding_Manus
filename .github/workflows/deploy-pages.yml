name: Publicar no GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Construir site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar páginas HTML dos capítulos
        run: npm run build:chapters

      - name: Preparar diretório de publicação
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site

          cp index.html _site/
          cp guia.html _site/
          cp projeto-integrador.html _site/
          cp checklists.html _site/
          cp sobre.html _site/

          cp -R assets _site/

          touch _site/.nojekyll

      - name: Validar conteúdo de publicação
        shell: bash
        run: |
          set -euo pipefail

          test -f _site/index.html
          test -f _site/guia.html
          test -f _site/projeto-integrador.html
          test -f _site/checklists.html
          test -f _site/sobre.html
          test -f _site/assets/css/style.css
          test -f _site/assets/js/app.js

          test -f _site/capitulos/01-ambiente-terminal.html
          test -f _site/capitulos/02-linguagem.html
          test -f _site/capitulos/03-entrega-organizacao.html
          test -f _site/capitulos/04-debug-camadas.html
          test -f _site/capitulos/05-calibrar-ia.html
          test -f _site/capitulos/06-github-actions.html
          test -f _site/capitulos/07-contexto-exploracao.html
          test -f _site/capitulos/08-especificacao.html
          test -f _site/capitulos/09-planejamento.html
          test -f _site/capitulos/10-implementacao-ia.html
          test -f _site/capitulos/11-seguranca-arquitetura.html

          echo "As 11 páginas HTML foram geradas corretamente."

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer upload do artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar site
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
